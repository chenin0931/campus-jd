name: weekly-update
on:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 09:00 北京时间
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch JDs (占位)
        run: |
          echo "TODO: 抓取脚本写入 data/$(date -u +%G-W%V)/<company>.json"
          # node scripts/fetch.js
      - name: Build
        run: node scripts/build.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "weekly: $(date -u +%G-W%V)"
          git push
