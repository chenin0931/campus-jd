name: weekly-update
# 每周一 09:00（北京时间）：抓取 → 链接校验 → 填仓库地址 → 预计算构建 site/ + 打包 skill → 提交 → 打 tag → Release 附 zip → 发布 GitHub Pages
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: weekly-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      week: ${{ steps.week.outputs.week }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: week
        run: echo "week=$(TZ=Asia/Shanghai date +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Fetch（大厂 19 家 Node 抓取器；全网/初创文件由 build 沿用上周，各公司独立，单家失败不影响其他家，失败的保留旧数据；滴滴解密用 Node 内置 crypto，无需 Python）
        run: |
          mkdir -p data/${{ steps.week.outputs.week }}
          failed=""
          for f in scripts/fetchers/*.js; do
            c=$(basename "$f" .js)
            node "$f" --week ${{ steps.week.outputs.week }} || failed="$failed $c"
          done
          # 抓取失败的公司：沿用上一周的文件，保证 build 不把它们当成全部下架
          prev=$(ls -d data/20*-W* | sort | tail -n 2 | head -n 1)
          for c in $failed; do
            [ -f "$prev/$c.json" ] && cp "$prev/$c.json" "data/${{ steps.week.outputs.week }}/$c.json"
          done
          echo "FAILED=$failed" >> "$GITHUB_ENV"
      - name: Check links（优先官网按 id 查详情接口，其次格式/HTTP 校验）
        run: node scripts/check_links.js
        continue-on-error: true
      - name: Browser link check（可选兜底，只复查未被接口确认的链接）
        continue-on-error: true
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/lib/check_links_browser.js --status unverified,format_verified --write
      - name: Fill repo URLs（把 SKILL.md、README 里的 <OWNER>/<REPO> 占位符换成本仓库；已替换过则不变）
        run: node scripts/set_repo.js "$GITHUB_REPOSITORY"
      - name: Build + package skill（失败即停止：切片 >8KB、id 重复、计数不一致、skill zip 与 SKILL.md 不一致）
        run: node scripts/build.js
      - name: Commit & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "weekly: ${{ steps.week.outputs.week }}${FAILED:+（抓取失败沿用旧数据:$FAILED）}"
          tag="w${{ steps.week.outputs.week }}"
          git tag -f "$tag"
          git push origin HEAD
          git push -f origin "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Release skill zip（README 的下载地址 releases/latest/download/campus-jd-skill.zip 指向最新 Release 的这个附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" skill/campus-jd-skill.zip --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" skill/campus-jd-skill.zip --latest --title "JD 库 $TAG" --notes "WorkBuddy 技能包：下载 campus-jd-skill.zip，不要解压，直接上传。"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
